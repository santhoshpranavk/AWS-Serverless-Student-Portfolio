
AWSTemplateFormatVersion: "2010-09-09"

Description: >
  AWS Serverless Student Portfolio infrastructure reference.
  Includes DynamoDB, Cognito, IAM, CloudWatch, SES,
  Lambda Web Functions, S3, SNS, CloudTrail, CodeBuild
  and CodePipeline.
  Reference only. Not intended for direct production deployment.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  PortfolioWebsiteURL:
    Type: String
    Default: "https://pranavk.co.in/"
    Description: Primary portfolio URL including trailing slash.

  PortfolioLegacyWebsiteURL:
    Type: String
    Default: "https://santhoshpranavk.github.io/AWS-Serverless-Student-Portfolio/"
    Description: Previous GitHub Pages URL including trailing slash.

  PortfolioEmailIdentity:
    Type: String
    NoEcho: true
    Description: Verified Amazon SES email identity.

  PortfolioCognitoDomainPrefix:
    Type: String
    Description: Unique Cognito managed login domain prefix.

  LambdaArtifactBucket:
    Type: String
    Description: Existing private S3 deployment artifact bucket.

  LambdaArtifactKey:
    Type: String
    Default: student-portfolio-api
    Description: Lambda deployment artifact object key.

  LambdaArtifactVersion:
    Type: String
    Description: Exact S3 object version used by the deployed revision.

  PortfolioAlertEmail:
    Type: String
    NoEcho: true
    Description: Email address for SNS monitoring notifications.

  PipelineArtifactBucket:
    Type: String
    Description: Existing private CodePipeline S3 artifact bucket.

  PipelineServiceRoleArn:
    Type: String
    Description: Existing CodePipeline IAM service role ARN.

  CodeBuildServiceRoleArn:
    Type: String
    Description: Existing CodeBuild IAM service role ARN.

  GitHubConnectionArn:
    Type: String
    Description: Existing authorized AWS CodeConnections GitHub connection ARN.

  GitHubRepositoryId:
    Type: String
    Default: santhoshpranavk/AWS-Serverless-Student-Portfolio
    Description: GitHub repository owner and repository name.

  GitHubBranch:
    Type: String
    Default: main
    Description: GitHub branch used by the CI pipeline.

# ============================================================
# METADATA
# ============================================================

Metadata:

  ProjectInformation:
    ProjectName: AWS Serverless Student Portfolio
    FrontendHosting: GitHub Pages
    PrimaryRegion: ap-south-1
    PrimaryWebsite: "https://pranavk.co.in/"
    BackendType: Lambda Web Function
    InfrastructurePurpose: Reference documentation only
    ExistingImportedResources: 12
    AdditionalResourceDefinitions: 15
    TotalResourceDefinitions: 27
    ImplementedAWSServices: 12
    ExistingS3BucketManagedExternally: true
    AuditBucketManagedOutsideLiveStack: true
    MonitoringResourcesManagedOutsideLiveStack: true
    CloudTrailManagedOutsideLiveStack: true
    CIResourcesManagedOutsideLiveStack: true
    AuditLogRetentionDays: 90

  ImplementedServices:
    - AWS Lambda Web Functions
    - Amazon DynamoDB
    - Amazon Cognito
    - Amazon SES
    - Amazon S3
    - AWS IAM
    - Amazon CloudWatch
    - Amazon SNS
    - AWS CloudTrail
    - AWS CloudFormation
    - AWS CodeBuild
    - AWS CodePipeline

  SupportingIntegrations:
    - AWS CodeConnections
    - GitHub
    - GitHub Pages
    - AWS managed encryption keys

  BackendDeployment:
    FunctionName: student-portfolio-api
    EndpointName: student-portfolio-api-endpoint
    Runtime: nodejs24.x
    DeploymentMode: LatestRevision
    Authentication: ApplicationManaged
    CustomDomainCORS: "https://pranavk.co.in"
    EnvironmentVariablesConfigured: false
    NetworkConnectorConfigured: false

  ContinuousIntegration:
    PipelineName: student-portfolio-pipeline
    PipelineType: V2
    ExecutionMode: SUPERSEDED
    SourceProvider: CodeStarSourceConnection
    BuildProject: student-portfolio-build
    NodeJSVersion: 24
    Trigger: Push to main
    DeploymentStageConfigured: false
    FrontendDeployment: GitHub Pages
    BackendDeployment: Lambda Web Function revisions

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # 01. DYNAMODB - PROJECTS TABLE
  # ==========================================================

  DynamoDBTableStudentportfolioprojects:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: student-portfolio-projects
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
      TableClass: STANDARD
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: false
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      ContributorInsightsSpecification:
        Enabled: false

  # ==========================================================
  # 02. DYNAMODB - BLOG POSTS TABLE
  # ==========================================================

  DynamoDBTableStudentportfolioblogposts:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: student-portfolio-blog-posts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: postId
          AttributeType: S
      KeySchema:
        - AttributeName: postId
          KeyType: HASH
      TableClass: STANDARD
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: false
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      ContributorInsightsSpecification:
        Enabled: false

  # ==========================================================
  # 03. DYNAMODB - CONTACT RATE LIMIT TABLE
  # ==========================================================

  DynamoDBTableStudentportfoliocontactratelimit:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: student-portfolio-contact-ratelimit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rateLimitKey
          AttributeType: S
      KeySchema:
        - AttributeName: rateLimitKey
          KeyType: HASH
      TableClass: STANDARD
      DeletionProtectionEnabled: false
      SSESpecification:
        SSEEnabled: false
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      ContributorInsightsSpecification:
        Enabled: false
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: expiresAt

  # ==========================================================
  # 04. COGNITO - USER POOL
  # ==========================================================

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: student-portfolio-user-pool
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      IssuerConfiguration:
        Type: ORIGINAL
      KeyConfiguration:
        KeyType: AWS_OWNED_KEY
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
          - Name: verified_phone_number
            Priority: 2

  # ==========================================================
  # 05. COGNITO - ADMIN GROUP
  # ==========================================================

  CognitoUserPoolGroupPortfolioAdmins:
    Type: AWS::Cognito::UserPoolGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GroupName: PortfolioAdmins
      Description: >
        Authorized administrators for the
        AWS Serverless Student Portfolio.
      UserPoolId: !Ref CognitoUserPool

  # ==========================================================
  # 06. COGNITO - APPLICATION CLIENT
  # ==========================================================

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ClientName: student-portfolio-admin-spa
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
      SupportedIdentityProviders:
        - COGNITO

      CallbackURLs:
        - !Ref PortfolioWebsiteURL
        - !Sub "${PortfolioWebsiteURL}admin.html"
        - !Ref PortfolioLegacyWebsiteURL
        - !Sub "${PortfolioLegacyWebsiteURL}admin.html"

      LogoutURLs:
        - !Ref PortfolioWebsiteURL
        - !Sub "${PortfolioWebsiteURL}admin.html"
        - !Ref PortfolioLegacyWebsiteURL
        - !Sub "${PortfolioLegacyWebsiteURL}admin.html"

      DefaultRedirectURI: !Ref PortfolioWebsiteURL

      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_AUTH
        - ALLOW_USER_SRP_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 5
      AuthSessionValidity: 3
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      EnablePropagateAdditionalUserContextData: false

  # ==========================================================
  # 07. COGNITO - MANAGED LOGIN DOMAIN
  # Reference resource, not currently imported.
  # ==========================================================

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Domain: !Ref PortfolioCognitoDomainPrefix
      ManagedLoginVersion: 2

  # ==========================================================
  # 08. COGNITO - MANAGED LOGIN BRANDING
  # Reference resource, not currently imported.
  # ==========================================================

  CognitoManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - CognitoUserPoolDomain
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientId: !Ref CognitoUserPoolClient
      UseCognitoProvidedValues: false

      Settings:
        categories:
          global:
            colorSchemeMode: DARK
            spacingDensity: CONDENSED
            pageHeader:
              enabled: false
            pageFooter:
              enabled: false

          form:
            sessionTimerDisplay: NONE
            instructions:
              enabled: false
            languageSelector:
              enabled: false
            displayGraphics: true
            location:
              horizontal: CENTER
              vertical: CENTER

          auth:
            federation:
              interfaceStyle: BUTTON_LIST
              order: []
            authMethodOrder:
              - - display: BUTTON
                  type: FEDERATED
                - display: INPUT
                  type: USERNAME_PASSWORD

          signUp:
            acceptanceElements:
              - enforcement: NONE
                textKey: en

        components:
          form:
            borderRadius: 8
            lightMode:
              backgroundColor: "ffffffff"
              borderColor: "c6c6cdff"
            darkMode:
              backgroundColor: "0f1b2aff"
              borderColor: "424650ff"
            backgroundImage:
              enabled: false
            logo:
              location: CENTER
              position: TOP
              enabled: false
              formInclusion: IN

          pageBackground:
            image:
              enabled: true
            lightMode:
              color: "ffffffff"
            darkMode:
              color: "0f1b2aff"

          pageText:
            lightMode:
              bodyColor: "414d5cff"
              headingColor: "000716ff"
              descriptionColor: "414d5cff"
            darkMode:
              bodyColor: "b6bec9ff"
              headingColor: "d1d5dbff"
              descriptionColor: "b6bec9ff"

          primaryButton:
            lightMode:
              defaults:
                backgroundColor: "0972d3ff"
                textColor: "ffffffff"
              hover:
                backgroundColor: "033160ff"
                textColor: "ffffffff"
              active:
                backgroundColor: "033160ff"
                textColor: "ffffffff"
              disabled:
                backgroundColor: "ffffffff"
                borderColor: "ffffffff"

            darkMode:
              defaults:
                backgroundColor: "539fe5ff"
                textColor: "000716ff"
              hover:
                backgroundColor: "89bdeeff"
                textColor: "000716ff"
              active:
                backgroundColor: "539fe5ff"
                textColor: "000716ff"
              disabled:
                backgroundColor: "ffffffff"
                borderColor: "ffffffff"

        componentClasses:
          buttons:
            borderRadius: 8

          input:
            borderRadius: 8
            lightMode:
              defaults:
                backgroundColor: "ffffffff"
                borderColor: "7d8998ff"
              placeholderColor: "5f6b7aff"
            darkMode:
              defaults:
                backgroundColor: "0f1b2aff"
                borderColor: "5f6b7aff"
              placeholderColor: "8d99a8ff"

          inputLabel:
            lightMode:
              textColor: "000716ff"
            darkMode:
              textColor: "d1d5dbff"

          link:
            lightMode:
              defaults:
                textColor: "0972d3ff"
              hover:
                textColor: "033160ff"
            darkMode:
              defaults:
                textColor: "539fe5ff"
              hover:
                textColor: "89bdeeff"

  # ==========================================================
  # 09. CLOUDWATCH - MAIN LOG GROUP
  # ==========================================================

  LogsLogGroupawslambdawebstudentportfolioapi:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/web/student-portfolio-api
      RetentionInDays: 30
      LogGroupClass: STANDARD
      DeletionProtectionEnabled: false

  # ==========================================================
  # 10. CLOUDWATCH - LOCAL LOG GROUP
  # ==========================================================

  LogsLogGroupawslambdawebstudentportfolioapilocal:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/web/student-portfolio-api.local
      RetentionInDays: 30
      LogGroupClass: STANDARD
      DeletionProtectionEnabled: false

  # ==========================================================
  # 11. SES - EMAIL IDENTITY
  # ==========================================================

  SESEmailIdentity:
    Type: AWS::SES::EmailIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmailIdentity: !Ref PortfolioEmailIdentity
      FeedbackAttributes:
        EmailForwardingEnabled: true

  # ==========================================================
  # 12. IAM - LAMBDA EXECUTION ROLE
  # ==========================================================

  IAMRoleStudentportfolioapi:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: student-portfolio-api-role
      Path: /service-role/
      MaxSessionDuration: 3600

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"

      Policies:

        - PolicyName: StudentPortfolioContactRateLimitPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ContactRateLimitTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt DynamoDBTableStudentportfoliocontactratelimit.Arn

        - PolicyName: StudentPortfolioDynamoDBReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadPortfolioProjects
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt DynamoDBTableStudentportfolioprojects.Arn

              - Sid: ReadPortfolioBlogPosts
                Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !GetAtt DynamoDBTableStudentportfolioblogposts.Arn

        - PolicyName: StudentPortfolioSESSendEmailPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowPortfolioSESEmailSending
                Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${PortfolioEmailIdentity}"

  # ==========================================================
  # 13. IAM - LAMBDA LOGGING MANAGED POLICY
  # ==========================================================

  IAMManagedPolicyLambdaLogging:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: StudentPortfolioLambdaLogging
      Path: /service-role/
      Description: >
        Allows the portfolio backend to create CloudWatch
        log groups and write application logs.
      Roles:
        - !Ref IAMRoleStudentportfolioapi

      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CreateLogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

          - Sid: WritePortfolioLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/web/student-portfolio-api:*"

  # ==========================================================
  # 14. IAM - ADMIN DYNAMODB WRITE POLICY
  # ==========================================================

  IAMManagedPolicyPolicyStudentPortfolioDynamoDBAdminWrite:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: StudentPortfolioDynamoDBAdminWrite
      Path: /
      Description: >
        Allows the portfolio Lambda backend to create,
        update and delete projects and blog posts.
        Administrator authorization is enforced by the
        application using Cognito access tokens.
      Roles:
        - !Ref IAMRoleStudentportfolioapi

      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowPortfolioAdminWrites
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt DynamoDBTableStudentportfolioprojects.Arn
              - !GetAtt DynamoDBTableStudentportfolioblogposts.Arn

  # ==========================================================
  # 15. LAMBDA - WEB FUNCTION
  # Reference resource, not currently imported.
  # ==========================================================

  LambdaWebFunction:
    Type: AWS::Lambda::WebFunction
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: student-portfolio-api

  # ==========================================================
  # 16. LAMBDA - WEB FUNCTION REVISION
  # Reference resource, not currently imported.
  #
  # The latest backend artifact includes the custom
  # domain in its application-level CORS allowlist.
  # The actual artifact version must be supplied.
  # ==========================================================

  LambdaWebFunctionRevision:
    Type: AWS::Lambda::WebFunctionRevision
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    DependsOn:
      - IAMManagedPolicyLambdaLogging
      - IAMManagedPolicyPolicyStudentPortfolioDynamoDBAdminWrite
      - SESEmailIdentity
      - CognitoUserPoolClient
      - CognitoUserPoolGroupPortfolioAdmins

    Properties:
      FunctionName: !GetAtt LambdaWebFunction.FunctionArn
      Description: Student Portfolio backend with custom domain CORS support.

      BuildConfig:
        CodeConfig:
          S3Object:
            Bucket: !Ref LambdaArtifactBucket
            Key: !Ref LambdaArtifactKey
            VersionId: !Ref LambdaArtifactVersion

        RuntimeConfig:
          Runtime: nodejs24.x

      ServiceConfig:
        ExecutionRoleArn: !GetAtt IAMRoleStudentportfolioapi.Arn
        TimeoutSeconds: 30
        MaxConcurrencyPerEnvironment: 64

        TelemetryConfig:
          LoggingConfig:
            LogGroup: !Ref LogsLogGroupawslambdawebstudentportfolioapi
            ApplicationLogLevel: INFO
            SystemLogLevel: INFO

  # ==========================================================
  # 17. LAMBDA - WEB FUNCTION ENDPOINT
  # Reference resource, not currently imported.
  #
  # The live endpoint uses LatestRevision deployment.
  # Explicit revision routing is represented here because
  # automatic deployment was not exposed by the previously
  # verified CloudFormation endpoint schema.
  # ==========================================================

  LambdaWebFunctionEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !GetAtt LambdaWebFunction.FunctionArn
      EndpointName: student-portfolio-api-endpoint
      EndpointType: HomeRegion
      AuthType: ApplicationManaged

      RevisionWeights:
        - RevisionId: !GetAtt LambdaWebFunctionRevision.RevisionId
          Weight: 100

  # ==========================================================
  # 18. SNS - MONITORING NOTIFICATION TOPIC
  # Reference resource, not currently imported.
  # ==========================================================

  SNSStudentPortfolioAlerts:
    Type: AWS::SNS::Topic
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TopicName: StudentPortfolioAlerts
      DisplayName: StudentPortfolioAlerts
      FifoTopic: false

  # ==========================================================
  # 19. SNS - EMAIL SUBSCRIPTION
  # Reference resource, not currently imported.
  # New deployments require email confirmation.
  # ==========================================================

  SNSStudentPortfolioEmailSubscription:
    Type: AWS::SNS::Subscription
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TopicArn: !Ref SNSStudentPortfolioAlerts
      Protocol: email
      Endpoint: !Ref PortfolioAlertEmail

  # ==========================================================
  # 20. CLOUDWATCH - API ERROR ALARM
  # Reference resource, not currently imported.
  # Notification integration has been manually tested.
  # Actual HTTP 5XX detection has not been independently tested.
  # ==========================================================

  CloudWatchStudentPortfolioAPI5XXAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - LambdaWebFunctionEndpoint

    Properties:
      AlarmName: StudentPortfolio-API-5XX-Errors
      AlarmDescription: >
        Monitors HTTP 5XX server errors for the
        student-portfolio-api Lambda Web Function.
        Triggers an Amazon SNS email notification when
        at least one server error occurs within a
        five-minute period. Missing data is treated
        as not breaching the threshold.

      ActionsEnabled: true
      AlarmActions:
        - !Ref SNSStudentPortfolioAlerts

      Namespace: AWS/Lambda/Web
      MetricName: HTTPResponseStatusClass5XX

      Dimensions:
        - Name: FunctionName
          Value: student-portfolio-api
        - Name: EndpointName
          Value: student-portfolio-api-endpoint

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      Tags:
        - Key: Project
          Value: StudentPortfolio

  # ==========================================================
  # 21. S3 - CLOUDTRAIL AUDIT LOG BUCKET
  # Reference resource, not currently imported.
  # Generated bucket name protects account-specific naming.
  # ==========================================================

  S3StudentPortfolioAuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      LifecycleConfiguration:
        Rules:
          - Id: StudentPortfolio-AuditLog-Retention
            Status: Enabled
            Prefix: AWSLogs/
            ExpirationInDays: 90

      # Versioning is not enabled on the existing audit bucket.
      # No static website hosting is configured.
      # No storage class transitions are configured.
      # No customer-managed KMS key is configured.

  # ==========================================================
  # 22. S3 - CLOUDTRAIL AUDIT BUCKET POLICY
  # Reference resource, not currently imported.
  # ==========================================================

  S3StudentPortfolioAuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      Bucket: !Ref S3StudentPortfolioAuditBucket

      PolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - s3:GetBucketAcl
            Resource: !GetAtt S3StudentPortfolioAuditBucket.Arn
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/student-portfolio-audit-trail"

          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - s3:PutObject
            Resource: !Sub "${S3StudentPortfolioAuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                "s3:x-amz-acl": bucket-owner-full-control
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/student-portfolio-audit-trail"

  # ==========================================================
  # 23. CLOUDTRAIL - INFRASTRUCTURE AUDIT TRAIL
  # Reference resource, not currently imported.
  # ==========================================================

  CloudTrailStudentPortfolioAuditTrail:
    Type: AWS::CloudTrail::Trail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    DependsOn:
      - S3StudentPortfolioAuditBucketPolicy

    Properties:
      TrailName: student-portfolio-audit-trail
      S3BucketName: !Ref S3StudentPortfolioAuditBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      IsOrganizationTrail: false

      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true

      Tags:
        - Key: Project
          Value: StudentPortfolio

      # SSE-KMS is intentionally not configured.
      # No data event selectors are configured.
      # No Insights event selectors are configured.
      # No network activity event selectors are configured.
      # No CloudWatch Logs integration is configured.
      # No SNS delivery notifications are configured.
      # Recursive logging was enabled in the live console.
      # Its CloudFormation property requires verification.

  # ==========================================================
  # 24. CLOUDWATCH - HIGH MEMORY ALARM
  # Reference resource, not currently imported.
  #
  # SNS notification delivery was manually tested.
  # Actual high memory conditions were not induced.
  # ==========================================================

  CloudWatchStudentPortfolioHighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    DependsOn:
      - LambdaWebFunction

    Properties:
      AlarmName: student-portfolio-lambda-web-high-memory

      AlarmDescription: >
        Monitors maximum environment memory usage for the
        student-portfolio-api Lambda Web Function.
        Sends an SNS notification when memory usage exceeds
        1600 MB for two consecutive five-minute periods.

      ActionsEnabled: true

      AlarmActions:
        - !Ref SNSStudentPortfolioAlerts

      Namespace: AWS/Lambda/Web
      MetricName: EnvironmentMaxMemoryUsage

      Dimensions:
        - Name: FunctionName
          Value: student-portfolio-api

      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

