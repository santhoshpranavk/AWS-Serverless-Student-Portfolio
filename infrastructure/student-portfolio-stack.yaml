
AWSTemplateFormatVersion: "2010-09-09"

Description: >
  AWS Serverless Student Portfolio infrastructure reference.
  Includes DynamoDB, Cognito, IAM, CloudWatch, SES,
  Lambda Web Functions, S3, SNS and CloudTrail.
  Reference only. Not intended for direct production deployment.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  PortfolioWebsiteURL:
    Type: String
    Default: "https://santhoshpranavk.github.io/AWS-Serverless-Student-Portfolio/"
    Description: Portfolio website URL including trailing slash.

  PortfolioEmailIdentity:
    Type: String
    NoEcho: true
    Description: Verified Amazon SES email identity.

  PortfolioCognitoDomainPrefix:
    Type: String
    Description: Unique Cognito managed login domain prefix.

  LambdaArtifactBucket:
    Type: String
    Description: Existing private S3 deployment artifact bucket.

  LambdaArtifactKey:
    Type: String
    Default: student-portfolio-api
    Description: Lambda deployment artifact object key.

  LambdaArtifactVersion:
    Type: String
    Description: Exact S3 object version used by the deployed revision.

  PortfolioAlertEmail:
    Type: String
    NoEcho: true
    Description: Email address for SNS monitoring notifications.

# ============================================================
# METADATA
# ============================================================

Metadata:

  ProjectInformation:
    ProjectName: AWS Serverless Student Portfolio
    FrontendHosting: GitHub Pages
    PrimaryRegion: ap-south-1
    BackendType: Lambda Web Function
    InfrastructurePurpose: Reference documentation only
    ExistingImportedResources: 12
    AdditionalResourceDefinitions: 11
    TotalResourceDefinitions: 23
    ImplementedAWSServices: 10
    ExistingS3BucketManagedExternally: true
    AuditBucketManagedOutsideLiveStack: true
    MonitoringResourcesManagedOutsideLiveStack: true
    CloudTrailManagedOutsideLiveStack: true
    AuditLogRetentionDays: 90

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # 01. AMAZON DYNAMODB - PROJECTS TABLE
  # ==========================================================

  DynamoDBTableStudentportfolioprojects:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: student-portfolio-projects

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S

      KeySchema:
        - AttributeName: projectId
          KeyType: HASH

      TableClass: STANDARD

      DeletionProtectionEnabled: true

      SSESpecification:
        SSEEnabled: false

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

      ContributorInsightsSpecification:
        Enabled: false

  # ==========================================================
  # 02. AMAZON DYNAMODB - BLOG POSTS TABLE
  # ==========================================================

  DynamoDBTableStudentportfolioblogposts:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: student-portfolio-blog-posts

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: postId
          AttributeType: S

      KeySchema:
        - AttributeName: postId
          KeyType: HASH

      TableClass: STANDARD

      DeletionProtectionEnabled: true

      SSESpecification:
        SSEEnabled: false

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

      ContributorInsightsSpecification:
        Enabled: false

  # ==========================================================
  # 03. AMAZON DYNAMODB - CONTACT RATE LIMIT TABLE
  # ==========================================================

  DynamoDBTableStudentportfoliocontactratelimit:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: student-portfolio-contact-ratelimit

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: rateLimitKey
          AttributeType: S

      KeySchema:
        - AttributeName: rateLimitKey
          KeyType: HASH

      TableClass: STANDARD

      DeletionProtectionEnabled: false

      SSESpecification:
        SSEEnabled: false

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

      ContributorInsightsSpecification:
        Enabled: false

      TimeToLiveSpecification:
        Enabled: true
        AttributeName: expiresAt

  # ==========================================================
  # 04. AMAZON COGNITO - USER POOL
  # ==========================================================

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      UserPoolName: student-portfolio-user-pool

      UserPoolTier: ESSENTIALS

      DeletionProtection: ACTIVE

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      UsernameConfiguration:
        CaseSensitive: false

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7

        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD

      MfaConfiguration: "OFF"

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE

      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT

      IssuerConfiguration:
        Type: ORIGINAL

      KeyConfiguration:
        KeyType: AWS_OWNED_KEY

      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

          - Name: verified_phone_number
            Priority: 2

  # ==========================================================
  # 05. AMAZON COGNITO - ADMIN GROUP
  # ==========================================================

  CognitoUserPoolGroupPortfolioAdmins:
    Type: AWS::Cognito::UserPoolGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      GroupName: PortfolioAdmins

      Description: >
        Authorized administrators for the
        AWS Serverless Student Portfolio.

      UserPoolId: !Ref CognitoUserPool

  # ==========================================================
  # 06. AMAZON COGNITO - APPLICATION CLIENT
  # ==========================================================

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      ClientName: student-portfolio-admin-spa

      UserPoolId: !Ref CognitoUserPool

      GenerateSecret: false

      AllowedOAuthFlowsUserPoolClient: true

      AllowedOAuthFlows:
        - code

      AllowedOAuthScopes:
        - email
        - openid

      SupportedIdentityProviders:
        - COGNITO

      CallbackURLs:
        - !Ref PortfolioWebsiteURL
        - !Sub "${PortfolioWebsiteURL}admin.html"

      LogoutURLs:
        - !Ref PortfolioWebsiteURL
        - !Sub "${PortfolioWebsiteURL}admin.html"

      DefaultRedirectURI: !Ref PortfolioWebsiteURL

      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_AUTH
        - ALLOW_USER_SRP_AUTH

      AccessTokenValidity: 60

      IdTokenValidity: 60

      RefreshTokenValidity: 5

      AuthSessionValidity: 3

      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

      PreventUserExistenceErrors: ENABLED

      EnableTokenRevocation: true

      EnablePropagateAdditionalUserContextData: false

  # ==========================================================
  # 07. AMAZON COGNITO - MANAGED LOGIN DOMAIN
  # Additional reference resource, not currently imported.
  # ==========================================================

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      UserPoolId: !Ref CognitoUserPool

      Domain: !Ref PortfolioCognitoDomainPrefix

      ManagedLoginVersion: 2

  # ==========================================================
  # 08. AMAZON COGNITO - MANAGED LOGIN BRANDING
  # Additional reference resource, not currently imported.
  # Core visual settings only.
  # ==========================================================

  CognitoManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    DependsOn:
      - CognitoUserPoolDomain

    Properties:
      UserPoolId: !Ref CognitoUserPool

      ClientId: !Ref CognitoUserPoolClient

      UseCognitoProvidedValues: false

      Settings:
        categories:
          global:
            colorSchemeMode: DARK
            spacingDensity: CONDENSED

            pageHeader:
              enabled: false

            pageFooter:
              enabled: false

          form:
            sessionTimerDisplay: NONE

            instructions:
              enabled: false

            languageSelector:
              enabled: false

            displayGraphics: true

            location:
              horizontal: CENTER
              vertical: CENTER

          auth:
            federation:
              interfaceStyle: BUTTON_LIST
              order: []

            authMethodOrder:
              - - display: BUTTON
                  type: FEDERATED

                - display: INPUT
                  type: USERNAME_PASSWORD

          signUp:
            acceptanceElements:
              - enforcement: NONE
                textKey: en

        components:
          form:
            borderRadius: 8

            lightMode:
              backgroundColor: "ffffffff"
              borderColor: "c6c6cdff"

            darkMode:
              backgroundColor: "0f1b2aff"
              borderColor: "424650ff"

            backgroundImage:
              enabled: false

            logo:
              location: CENTER
              position: TOP
              enabled: false
              formInclusion: IN

          pageBackground:
            image:
              enabled: true

            lightMode:
              color: "ffffffff"

            darkMode:
              color: "0f1b2aff"

          pageText:
            lightMode:
              bodyColor: "414d5cff"
              headingColor: "000716ff"
              descriptionColor: "414d5cff"

            darkMode:
              bodyColor: "b6bec9ff"
              headingColor: "d1d5dbff"
              descriptionColor: "b6bec9ff"

          primaryButton:
            lightMode:
              defaults:
                backgroundColor: "0972d3ff"
                textColor: "ffffffff"

              hover:
                backgroundColor: "033160ff"
                textColor: "ffffffff"

              active:
                backgroundColor: "033160ff"
                textColor: "ffffffff"

              disabled:
                backgroundColor: "ffffffff"
                borderColor: "ffffffff"

            darkMode:
              defaults:
                backgroundColor: "539fe5ff"
                textColor: "000716ff"

              hover:
                backgroundColor: "89bdeeff"
                textColor: "000716ff"

              active:
                backgroundColor: "539fe5ff"
                textColor: "000716ff"

              disabled:
                backgroundColor: "ffffffff"
                borderColor: "ffffffff"

        componentClasses:
          buttons:
            borderRadius: 8

          input:
            borderRadius: 8

            lightMode:
              defaults:
                backgroundColor: "ffffffff"
                borderColor: "7d8998ff"

              placeholderColor: "5f6b7aff"

            darkMode:
              defaults:
                backgroundColor: "0f1b2aff"
                borderColor: "5f6b7aff"

              placeholderColor: "8d99a8ff"

          inputLabel:
            lightMode:
              textColor: "000716ff"

            darkMode:
              textColor: "d1d5dbff"

          link:
            lightMode:
              defaults:
                textColor: "0972d3ff"

              hover:
                textColor: "033160ff"

            darkMode:
              defaults:
                textColor: "539fe5ff"

              hover:
                textColor: "89bdeeff"

  # ==========================================================
  # 09. AMAZON CLOUDWATCH - MAIN LOG GROUP
  # ==========================================================

  LogsLogGroupawslambdawebstudentportfolioapi:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      LogGroupName: /aws/lambda/web/student-portfolio-api

      RetentionInDays: 30

      LogGroupClass: STANDARD

      DeletionProtectionEnabled: false

  # ==========================================================
  # 10. AMAZON CLOUDWATCH - LOCAL LOG GROUP
  # ==========================================================

  LogsLogGroupawslambdawebstudentportfolioapilocal:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      LogGroupName: /aws/lambda/web/student-portfolio-api.local

      RetentionInDays: 30

      LogGroupClass: STANDARD

      DeletionProtectionEnabled: false

  # ==========================================================
  # 11. AMAZON SES - EMAIL IDENTITY
  # ==========================================================

  SESEmailIdentity:
    Type: AWS::SES::EmailIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      EmailIdentity: !Ref PortfolioEmailIdentity

      FeedbackAttributes:
        EmailForwardingEnabled: true

  # ==========================================================
  # 12. AWS IAM - LAMBDA EXECUTION ROLE
  # ==========================================================

  IAMRoleStudentportfolioapi:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      RoleName: student-portfolio-api-role

      Path: /service-role/

      MaxSessionDuration: 3600

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"

      Policies:

        # Contact rate limit permissions

        - PolicyName: StudentPortfolioContactRateLimitPolicy

          PolicyDocument:
            Version: "2012-10-17"

            Statement:
              - Sid: ContactRateLimitTableAccess

                Effect: Allow

                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem

                Resource: !GetAtt DynamoDBTableStudentportfoliocontactratelimit.Arn

        # Public projects and blog read permissions

        - PolicyName: StudentPortfolioDynamoDBReadOnly

          PolicyDocument:
            Version: "2012-10-17"

            Statement:
              - Sid: ReadPortfolioProjects

                Effect: Allow

                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan

                Resource: !GetAtt DynamoDBTableStudentportfolioprojects.Arn

              - Sid: ReadPortfolioBlogPosts

                Effect: Allow

                Action:
                  - dynamodb:Scan

                Resource: !GetAtt DynamoDBTableStudentportfolioblogposts.Arn

        # Amazon SES contact email permissions

        - PolicyName: StudentPortfolioSESSendEmailPolicy

          PolicyDocument:
            Version: "2012-10-17"

            Statement:
              - Sid: AllowPortfolioSESEmailSending

                Effect: Allow

                Action:
                  - ses:SendEmail

                Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${PortfolioEmailIdentity}"

  # ==========================================================
  # 13. AWS IAM - LAMBDA LOGGING MANAGED POLICY
  # ==========================================================

  IAMManagedPolicyLambdaLogging:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      ManagedPolicyName: StudentPortfolioLambdaLogging

      Path: /service-role/

      Description: >
        Allows the portfolio backend to create CloudWatch
        log groups and write application logs.

      Roles:
        - !Ref IAMRoleStudentportfolioapi

      PolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Sid: CreateLogGroups

            Effect: Allow

            Action:
              - logs:CreateLogGroup

            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

          - Sid: WritePortfolioLogs

            Effect: Allow

            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents

            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/web/student-portfolio-api:*"

  # ==========================================================
  # 14. AWS IAM - ADMIN DYNAMODB WRITE POLICY
  # ==========================================================

  IAMManagedPolicyPolicyStudentPortfolioDynamoDBAdminWrite:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      ManagedPolicyName: StudentPortfolioDynamoDBAdminWrite

      Path: /

      Description: >
        Allows the portfolio Lambda backend to create,
        update and delete projects and blog posts.
        Administrator authorization is enforced by the
        application using Cognito access tokens.

      Roles:
        - !Ref IAMRoleStudentportfolioapi

      PolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Sid: AllowPortfolioAdminWrites

            Effect: Allow

            Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem

            Resource:
              - !GetAtt DynamoDBTableStudentportfolioprojects.Arn
              - !GetAtt DynamoDBTableStudentportfolioblogposts.Arn

  # ==========================================================
  # 15. AWS LAMBDA - WEB FUNCTION
  # Additional reference resource, not currently imported.
  # ==========================================================

  LambdaWebFunction:
    Type: AWS::Lambda::WebFunction
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      FunctionName: student-portfolio-api

  # ==========================================================
  # 16. AWS LAMBDA - WEB FUNCTION REVISION
  # Additional reference resource, not currently imported.
  # ==========================================================

  LambdaWebFunctionRevision:
    Type: AWS::Lambda::WebFunctionRevision
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    DependsOn:
      - IAMManagedPolicyLambdaLogging
      - IAMManagedPolicyPolicyStudentPortfolioDynamoDBAdminWrite
      - SESEmailIdentity
      - CognitoUserPoolClient
      - CognitoUserPoolGroupPortfolioAdmins

    Properties:
      FunctionName: !GetAtt LambdaWebFunction.FunctionArn

      Description: Student Portfolio backend reference revision.

      BuildConfig:

        CodeConfig:
          S3Object:
            Bucket: !Ref LambdaArtifactBucket
            Key: !Ref LambdaArtifactKey
            VersionId: !Ref LambdaArtifactVersion

        RuntimeConfig:
          Runtime: nodejs24.x

      ServiceConfig:
        ExecutionRoleArn: !GetAtt IAMRoleStudentportfolioapi.Arn

        TimeoutSeconds: 30

        MaxConcurrencyPerEnvironment: 64

        TelemetryConfig:
          LoggingConfig:
            LogGroup: !Ref LogsLogGroupawslambdawebstudentportfolioapi

            ApplicationLogLevel: INFO

            SystemLogLevel: INFO

  # ==========================================================
  # 17. AWS LAMBDA - WEB FUNCTION ENDPOINT
  # Additional reference resource, not currently imported.
  #
  # Automatic deployment to LatestRevision is not exposed
  # by the previously verified CloudFormation endpoint schema.
  # Explicit revision routing is represented instead.
  # ==========================================================

  LambdaWebFunctionEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      FunctionName: !GetAtt LambdaWebFunction.FunctionArn

      EndpointName: student-portfolio-api-endpoint

      EndpointType: HomeRegion

      AuthType: ApplicationManaged

      RevisionWeights:
        - RevisionId: !GetAtt LambdaWebFunctionRevision.RevisionId
          Weight: 100

  # ==========================================================
  # 18. AMAZON SNS - MONITORING NOTIFICATION TOPIC
  # Additional reference resource, not currently imported.
  # ==========================================================

  SNSStudentPortfolioAlerts:
    Type: AWS::SNS::Topic
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TopicName: StudentPortfolioAlerts

      DisplayName: StudentPortfolioAlerts

      FifoTopic: false

  # ==========================================================
  # 19. AMAZON SNS - EMAIL SUBSCRIPTION
  # Additional reference resource, not currently imported.
  #
  # A new deployment would require email confirmation.
  # Existing subscription confirmation is not recreated
  # automatically by this reference template.
  # ==========================================================

  SNSStudentPortfolioEmailSubscription:
    Type: AWS::SNS::Subscription
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TopicArn: !Ref SNSStudentPortfolioAlerts

      Protocol: email

      Endpoint: !Ref PortfolioAlertEmail

  # ==========================================================
  # 20. AMAZON CLOUDWATCH - API ERROR ALARM
  # Additional reference resource, not currently imported.
  #
  # Monitors HTTP 5XX errors from the Lambda Web Function.
  # Notification integration has been manually tested.
  # Actual HTTP 5XX detection has not been independently tested.
  # ==========================================================

  CloudWatchStudentPortfolioAPI5XXAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    DependsOn:
      - LambdaWebFunctionEndpoint

    Properties:
      AlarmName: StudentPortfolio-API-5XX-Errors

      AlarmDescription: >
        Monitors HTTP 5XX server errors for the
        student-portfolio-api Lambda Web Function.
        Triggers an Amazon SNS email notification when
        at least one server error occurs within a
        five-minute period. Missing data is treated
        as not breaching the threshold.

      ActionsEnabled: true

      AlarmActions:
        - !Ref SNSStudentPortfolioAlerts

      Namespace: AWS/Lambda/Web

      MetricName: HTTPResponseStatusClass5XX

      Dimensions:
        - Name: FunctionName
          Value: student-portfolio-api

        - Name: EndpointName
          Value: student-portfolio-api-endpoint

      Statistic: Sum

      Period: 300

      EvaluationPeriods: 1

      DatapointsToAlarm: 1

      Threshold: 1

      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: notBreaching

      Tags:
        - Key: Project
          Value: StudentPortfolio

  # ==========================================================
  # 21. AMAZON S3 - CLOUDTRAIL AUDIT LOG BUCKET
  # Additional reference resource, not currently imported.
  #
  # CloudFormation-generated bucket name is used instead
  # of exposing the existing account-specific bucket name.
  #
  # This is not the Lambda deployment artifact bucket.
  # ==========================================================

  S3StudentPortfolioAuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

            BucketKeyEnabled: false

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      # Versioning is intentionally omitted because
      # versioning is not enabled on the existing audit bucket.

      LifecycleConfiguration:
        Rules:
          - Id: StudentPortfolio-AuditLog-Retention

            Status: Enabled

            Prefix: AWSLogs/

            ExpirationInDays: 90

      # No static website hosting is configured.
      # No storage class transitions are configured.
      # No customer-managed KMS key is configured.

  # ==========================================================
  # 22. AMAZON S3 - CLOUDTRAIL AUDIT BUCKET POLICY
  # Additional reference resource, not currently imported.
  #
  # Restricts CloudTrail access to the dedicated trail
  # and the correct AWS account log prefix.
  #
  # The trail ARN is constructed using pseudo parameters
  # to avoid a circular dependency between the trail
  # and the S3 bucket policy.
  # ==========================================================

  S3StudentPortfolioAuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      Bucket: !Ref S3StudentPortfolioAuditBucket

      PolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Sid: AWSCloudTrailAclCheck

            Effect: Allow

            Principal:
              Service: cloudtrail.amazonaws.com

            Action:
              - s3:GetBucketAcl

            Resource: !GetAtt S3StudentPortfolioAuditBucket.Arn

            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/student-portfolio-audit-trail"

          - Sid: AWSCloudTrailWrite

            Effect: Allow

            Principal:
              Service: cloudtrail.amazonaws.com

            Action:
              - s3:PutObject

            Resource: !Sub "${S3StudentPortfolioAuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*"

            Condition:
              StringEquals:
                "s3:x-amz-acl": bucket-owner-full-control

                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/student-portfolio-audit-trail"

  # ==========================================================
  # 23. AWS CLOUDTRAIL - INFRASTRUCTURE AUDIT TRAIL
  # Additional reference resource, not currently imported.
  #
  # Records account-wide management events.
  # Data events, Insights events and network activity
  # events are not configured.
  #
  # CloudWatch Logs integration and SNS delivery
  # notifications are intentionally omitted.
  #
  # Recursive logging was enabled in the existing console
  # configuration. Its CloudFormation property support
  # requires separate schema verification.
  # ==========================================================

  CloudTrailStudentPortfolioAuditTrail:
    Type: AWS::CloudTrail::Trail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    DependsOn:
      - S3StudentPortfolioAuditBucketPolicy

    Properties:
      TrailName: student-portfolio-audit-trail

      S3BucketName: !Ref S3StudentPortfolioAuditBucket

      IsLogging: true

      IsMultiRegionTrail: true

      IncludeGlobalServiceEvents: true

      EnableLogFileValidation: true

      IsOrganizationTrail: false

      EventSelectors:
        - ReadWriteType: All

          IncludeManagementEvents: true

      Tags:
        - Key: Project
          Value: StudentPortfolio

      # SSE-KMS is intentionally not configured.
      # The S3 audit bucket uses SSE-S3 encryption.
      #
      # KMS management events are not excluded.
      # RDS Data API management events are not excluded.
      #
      # No data event selectors are configured.
      # No Insights event selectors are configured.
      # No network activity event selectors are configured.

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  PortfolioWebsite:
    Description: Public portfolio website.
    Value: !Ref PortfolioWebsiteURL

  PortfolioAdminDashboard:
    Description: Portfolio administrator dashboard.
    Value: !Sub "${PortfolioWebsiteURL}admin.html"

  ProjectsTableName:
    Description: DynamoDB projects table.
    Value: !Ref DynamoDBTableStudentportfolioprojects

  BlogTableName:
    Description: DynamoDB blog posts table.
    Value: !Ref DynamoDBTableStudentportfolioblogposts

  ContactRateLimitTableName:
    Description: DynamoDB contact rate limit table.
    Value: !Ref DynamoDBTableStudentportfoliocontactratelimit

  CognitoUserPoolId:
    Description: Cognito user pool identifier.
    Value: !Ref CognitoUserPool

  CognitoAppClientId:
    Description: Cognito application client identifier.
    Value: !Ref CognitoUserPoolClient

  CognitoAdminGroup:
    Description: Cognito administrator group.
    Value: !Ref CognitoUserPoolGroupPortfolioAdmins

  CognitoManagedLoginURL:
    Description: Cognito managed login base URL.
    Value: !Sub "https://${PortfolioCognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

  CognitoBrandingId:
    Description: Managed login branding identifier.
    Value: !GetAtt CognitoManagedLoginBranding.ManagedLoginBrandingId

  LambdaExecutionRoleArn:
    Description: Lambda execution role ARN.
    Value: !GetAtt IAMRoleStudentportfolioapi.Arn

  LambdaWebFunctionArn:
    Description: Lambda Web Function ARN.
    Value: !GetAtt LambdaWebFunction.FunctionArn

  LambdaRevisionId:
    Description: Lambda backend revision identifier.
    Value: !GetAtt LambdaWebFunctionRevision.RevisionId

  LambdaEndpointURL:
    Description: Public HTTPS backend endpoint.
    Value: !Sub "https://${LambdaWebFunctionEndpoint.DomainName}/"

  LambdaDeploymentArtifactBucket:
    Description: Existing S3 deployment artifact bucket.
    Value: !Ref LambdaArtifactBucket

  MainLambdaLogGroup:
    Description: Main Lambda CloudWatch log group.
    Value: !Ref LogsLogGroupawslambdawebstudentportfolioapi

  LocalLambdaLogGroup:
    Description: Local Lambda CloudWatch log group.
    Value: !Ref LogsLogGroupawslambdawebstudentportfolioapilocal

  MonitoringSNSTopicArn:
    Description: Portfolio monitoring SNS notification topic ARN.
    Value: !Ref SNSStudentPortfolioAlerts

  MonitoringAlarmName:
    Description: Portfolio API HTTP 5XX error alarm name.
    Value: !Ref CloudWatchStudentPortfolioAPI5XXAlarm

  MonitoringAlarmArn:
    Description: Portfolio API HTTP 5XX error alarm ARN.
    Value: !GetAtt CloudWatchStudentPortfolioAPI5XXAlarm.Arn

  CloudTrailAuditBucketName:
    Description: CloudTrail audit log storage bucket.
    Value: !Ref S3StudentPortfolioAuditBucket

  CloudTrailAuditBucketArn:
    Description: CloudTrail audit log storage bucket ARN.
    Value: !GetAtt S3StudentPortfolioAuditBucket.Arn

  CloudTrailAuditTrailArn:
    Description: Portfolio infrastructure audit trail ARN.
    Value: !GetAtt CloudTrailStudentPortfolioAuditTrail.Arn

  CloudTrailAuditRetentionDays:
    Description: Audit log lifecycle expiration period in days.
    Value: "90"

  DeploymentRegion:
    Description: AWS deployment region.
    Value: !Ref AWS::Region

