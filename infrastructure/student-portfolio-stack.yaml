  # ==========================================================
  # 26. CODEBUILD - PORTFOLIO BUILD PROJECT
  # Reference resource, not currently imported.
  #
  # Preserves the verified existing GITHUB source
  # and NO_ARTIFACTS project configuration.
  # The existing service role is supplied as a parameter.
  # ==========================================================

  CodeBuildStudentPortfolioProject:
    Type: AWS::CodeBuild::Project
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      Name: student-portfolio-build

      Description: >
        Validates the AWS Serverless Student Portfolio
        frontend using Node.js 24, checks the CloudFormation
        reference template, and prepares build artifacts
        for CodePipeline.

      ServiceRole: !Ref CodeBuildServiceRoleArn

      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${GitHubRepositoryId}"
        GitCloneDepth: 1
        GitSubmodulesConfig:
          FetchSubmodules: false
        BuildSpec: buildspec.yml
        ReportBuildStatus: false
        InsecureSsl: false

      SourceVersion: !Ref GitHubBranch

      Artifacts:
        Type: NO_ARTIFACTS

      Cache:
        Type: NO_CACHE

      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux-x86_64-standard:6.0
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: false
        ImagePullCredentialsType: CODEBUILD

        EnvironmentVariables:
          - Name: CODEBUILD_CONFIG_AUTO_DISCOVER
            Value: "false"
            Type: PLAINTEXT

      TimeoutInMinutes: 10
      QueuedTimeoutInMinutes: 10
      ConcurrentBuildLimit: 1

      EncryptionKey: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/s3"

      BadgeEnabled: false

      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: /aws/codebuild/student-portfolio-build

        S3Logs:
          Status: DISABLED
          EncryptionDisabled: false

      Tags:
        - Key: Project
          Value: StudentPortfolio

    Metadata:
      ExistingProjectVisibility: PRIVATE
      ExistingHostKernel: LINUX_KERNEL_6
      ExistingComputeProvider: EC2
      ExistingOperatingSystem: Amazon Linux 2023
      BuildRuntime: Node.js 24
      BuildRuntimeConfiguredIn: buildspec.yml
      ExistingComputeVCPUs: 2
      ExistingComputeMemoryGiB: 4

  # ==========================================================
  # 27. CODEPIPELINE - PORTFOLIO CI PIPELINE
  # Reference resource, not currently imported.
  #
  # Existing IAM role, S3 artifact bucket and authorized
  # GitHub connection are external dependencies.
  #
  # This pipeline performs source retrieval and builds.
  # It does not deploy the frontend or backend.
  # ==========================================================

  CodePipelineStudentPortfolio:
    Type: AWS::CodePipeline::Pipeline
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      Name: student-portfolio-pipeline
      RoleArn: !Ref PipelineServiceRoleArn

      PipelineType: V2
      ExecutionMode: SUPERSEDED
      RestartExecutionOnUpdate: false

      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket

      Stages:

        - Name: Source

          Actions:

            - Name: Source

              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"

              RunOrder: 1

              Configuration:
                BranchName: !Ref GitHubBranch
                ConnectionArn: !Ref GitHubConnectionArn
                DetectChanges: "false"
                FullRepositoryId: !Ref GitHubRepositoryId
                OutputArtifactFormat: CODE_ZIP

              OutputArtifacts:
                - Name: SourceArtifact

              Region: !Ref AWS::Region
              Namespace: SourceVariables

        - Name: Build

          Actions:

            - Name: Build

              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"

              RunOrder: 1

              Configuration:
                ProjectName: !Ref CodeBuildStudentPortfolioProject

              InputArtifacts:
                - Name: SourceArtifact

              OutputArtifacts:
                - Name: BuildArtifact

              Region: !Ref AWS::Region
              Namespace: BuildVariables

      Triggers:

        - ProviderType: CodeStarSourceConnection

          GitConfiguration:
            SourceActionName: Source

            Push:
              - Branches:
                  Includes:
                    - !Ref GitHubBranch

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  PortfolioWebsite:
    Description: Public portfolio website.
    Value: !Ref PortfolioWebsiteURL

  PortfolioAdminDashboard:
    Description: Portfolio administrator dashboard.
    Value: !Sub "${PortfolioWebsiteURL}admin.html"

  PortfolioLegacyWebsite:
    Description: Previous GitHub Pages website URL.
    Value: !Ref PortfolioLegacyWebsiteURL

  ProjectsTableName:
