              }
            },
            {
              "type": "metric",
              "x": 6,
              "y": 0,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/Lambda/Web",
                    "EnvironmentMaxMemoryUsage",
                    "FunctionName",
                    "student-portfolio-api"
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Web - Memory Usage",
                "stat": "Maximum",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 6,
              "height": 6,
              "properties": {
                "metrics": [
                  [
                    "AWS/Lambda/Web",
                    "EnvironmentConcurrentRequests",
                    "FunctionName",
                    "student-portfolio-api"
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Web - Concurrent Requests",
                "stat": "Maximum",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 18,
